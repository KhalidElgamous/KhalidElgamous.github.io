name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency: ci-${{ github.ref }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     node-version: [10.x, 12.x, 14.x, 16.x, 18.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        # uses: actions/setup-node@v1
        # uses: actions/setup-node@v3
        uses: actions/setup-node@v4
        with:
          # node-version: 14
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - run: npm install

      - name: Build
        run: npm run build      # runs `next build`, output goes to ./out
      - run: npm run export
        env:
          CI: true
          DEPLOY_TARGET: gh-pages
      - run: touch out/.nojekyll

      - name: Debug - did the build create out/?
        run: |
          ls next.config.* || echo "no next.config found"
          ls -la out || echo "out/ does NOT exist"

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: out
          CLEAN: true
